<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend</title>
    <style>
        body {
            background-color: #fdfcf0;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Force la symétrie */
            height: 300px; /* Définit une zone fixe pour la symétrie */
            width: 90%;
        }
        .message {
            text-align: center;
            font-size: 1.2rem;
            line-height: 2;
        }
        .symbols {
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-shadow: 0 0 10px #d4af37, 0 0 20px #b8860b;
        }
        #text {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="symbols">ᛉ ❤ ᚷ ❤ ᛉ</div>
        <div class="message" id="text"></div>
        <div class="symbols">ᛉ ❤ ᚷ ❤ ᛉ</div>
    </div>

    <script>
        const textElement = document.getElementById('text');
        const content = "THE QUEST ENDS.\nTHE LEGEND BEGINS.";
        let index = 0;

        function typeWriter() {
            if (index < content.length) {
                textElement.textContent += content.charAt(index);
                index++;
                setTimeout(typeWriter, 120);
            }
        }
        window.onload = typeWriter;
    </script>
</body>
</html>
